<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="400"
  viewBox="0 0 800 400"
  fill="none"
  role="img"
  aria-labelledby="light-cover-title light-cover-description"
>
  <title id="light-cover-title">Lamplit Light sovereign AI models</title>
  <desc id="light-cover-description">
    A large teacher model distils through a narrowing flow into a small amber
    model core inside a device, ready to run in self-hosted runtimes.
  </desc>

  <defs>
    <linearGradient id="background" x1="42" y1="18" x2="760" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554" />
      <stop offset="0.5" stop-color="#111827" />
      <stop offset="1" stop-color="#3B1D0A" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(480 188) rotate(90) scale(210 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5C46B" stop-opacity="0.2" />
      <stop offset="1" stop-color="#F5C46B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="distill" x1="205" y1="0" x2="555" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5B4FC" />
      <stop offset="0.45" stop-color="#67E8F9" />
      <stop offset="1" stop-color="#F5C46B" />
    </linearGradient>
    <linearGradient id="amberCore" x1="560" y1="148" x2="646" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D88A" />
      <stop offset="0.5" stop-color="#F5C46B" />
      <stop offset="1" stop-color="#E8A33A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.36" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.045" />
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#F5C46B" />
    </marker>
  </defs>

  <rect width="800" height="400" fill="url(#background)" />
  <rect width="800" height="400" fill="url(#grid)" />
  <rect width="800" height="400" fill="url(#glow)" />
  <circle cx="112" cy="74" r="118" fill="#818CF8" fill-opacity="0.055" />
  <circle cx="700" cy="312" r="138" fill="#E8A33A" fill-opacity="0.07" />

  <g font-family="Inter, system-ui, sans-serif">
    <text x="64" y="55" fill="#FFFFFF" fill-opacity="0.92" font-size="25" font-weight="700" letter-spacing="3">
      LAMPLIT LIGHT
    </text>
    <g transform="translate(596 30)">
      <rect width="140" height="30" rx="15" fill="#F5C46B" fill-opacity="0.1" stroke="#F5C46B" stroke-opacity="0.44" />
      <circle cx="18" cy="15" r="4" fill="#F5C46B" />
      <text x="31" y="19" fill="#FDE68A" font-size="10" font-weight="700" letter-spacing="1.1">
        IN DEVELOPMENT
      </text>
    </g>

    <g transform="translate(66 110)" filter="url(#shadow)">
      <circle cx="104" cy="78" r="72" fill="#0F172A" fill-opacity="0.82" stroke="#A5B4FC" stroke-opacity="0.45" stroke-width="2" />
      <circle cx="64" cy="77" r="38" fill="#1E3A8A" fill-opacity="0.54" />
      <circle cx="134" cy="65" r="44" fill="#312E81" fill-opacity="0.52" />
      <circle cx="120" cy="106" r="46" fill="#0E7490" fill-opacity="0.35" />
      <g stroke="#BFDBFE" stroke-opacity="0.58" stroke-width="2">
        <circle cx="72" cy="74" r="5" fill="#A5B4FC" />
        <circle cx="104" cy="54" r="5" fill="#A5B4FC" />
        <circle cx="134" cy="80" r="5" fill="#67E8F9" />
        <circle cx="104" cy="111" r="5" fill="#67E8F9" />
        <path d="M77 73L99 56M109 57L129 77M132 85L108 108M99 108L76 78M77 76L129 81" stroke-opacity="0.48" />
      </g>
      <text x="104" y="170" fill="#C7D2FE" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">
        TEACHER MODEL
      </text>
    </g>

    <g transform="translate(258 146)">
      <path d="M0 42C48 16 96 16 144 42" stroke="url(#distill)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.72" />
      <path d="M0 84C48 110 96 110 144 84" stroke="url(#distill)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55" />
      <path d="M10 62H258" stroke="url(#distill)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
      <path d="M146 42L242 62L146 84Z" fill="#F5C46B" fill-opacity="0.1" stroke="#F5C46B" stroke-opacity="0.36" />
      <g fill="#E0F2FE" fill-opacity="0.64" font-size="10" font-weight="700" letter-spacing="1.1">
        <text x="22" y="28">DISTIL</text>
        <text x="92" y="121">GATE</text>
        <text x="178" y="42">COMPRESS</text>
      </g>
      <g fill="#67E8F9">
        <circle cx="42" cy="62" r="3" fill-opacity="0.75" />
        <circle cx="86" cy="62" r="2.5" fill-opacity="0.65" />
        <circle cx="130" cy="62" r="2.2" fill-opacity="0.55" />
        <circle cx="172" cy="62" r="1.9" fill-opacity="0.45" />
      </g>
    </g>

    <g transform="translate(522 94)" filter="url(#shadow)">
      <rect width="196" height="164" rx="20" fill="#0F172A" fill-opacity="0.88" stroke="#F5C46B" stroke-opacity="0.52" />
      <rect x="18" y="18" width="160" height="100" rx="13" fill="#020617" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.12" />
      <rect x="18" y="18" width="160" height="22" rx="13" fill="#FFFFFF" fill-opacity="0.07" />
      <circle cx="34" cy="29" r="3" fill="#F87171" fill-opacity="0.72" />
      <circle cx="47" cy="29" r="3" fill="#FBBF24" fill-opacity="0.72" />
      <circle cx="60" cy="29" r="3" fill="#34D399" fill-opacity="0.72" />
      <circle cx="98" cy="76" r="35" fill="url(#amberCore)" />
      <circle cx="98" cy="76" r="48" stroke="#F5C46B" stroke-opacity="0.28" stroke-width="2" />
      <path d="M98 48V104M70 76H126M79 57L117 95M117 57L79 95" stroke="#78350F" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round" />
      <text x="98" y="143" fill="#FDE68A" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">
        light-tutor-v1
      </text>
    </g>

    <g transform="translate(86 286)">
      <rect width="628" height="70" rx="18" fill="#020617" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.1" />
      <text x="26" y="29" fill="#FDE68A" font-size="11" font-weight="700" letter-spacing="1.5">
        AI THAT RUNS WHERE YOU ARE
      </text>
      <text x="26" y="49" fill="#FFFFFF" fill-opacity="0.56" font-size="11">
        browser · laptop · on-prem · app · edge
      </text>
      <path d="M350 14V56" stroke="#FFFFFF" stroke-opacity="0.1" />
      <text x="374" y="29" fill="#CFFAFE" font-size="11" font-weight="700" letter-spacing="1.5">
        YOUR DATA NEVER LEAVES
      </text>
      <text x="374" y="49" fill="#FFFFFF" fill-opacity="0.56" font-size="11">
        verified knowledge · judge panel · ONNX exports
      </text>
    </g>
  </g>
</svg>
